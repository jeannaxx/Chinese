<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HSK 3.0 ภาษาไทย</title>
<meta name="description" content="ท่องศัพท์ภาษาจีน HSK 3.0 ระดับ 1–6 พร้อมพินอินและความหมายภาษาไทย: แฟลชการ์ด แบบทดสอบ เขียนพินอิน และเรียงประโยค">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one-column phone-first study app; ink-red hero, paper cards, tone-coloured pinyin */
:root{
  --bg:#F7F4F0; --card:#FFFFFF; --ink:#1E1A17; --muted:#6B625B; --line:#DED6CE; --soft:#EFE9E3;
  --hero:#9E2A22; --hero-ink:#FFFFFF; --hero-muted:#F3D3CE;
  --primary:#9E2A22; --primary-ink:#FFFFFF; --accent:#9E2A22; --accent-soft:#F8E4E1;
  --good:#1E6B34; --good-soft:#E6F4EA; --bad:#A3214B; --bad-soft:#FCE4EC; --warn:#8A4B00; --warn-soft:#FFF1DB;
  --dark:#1E1A17; --dark-ink:#FFFFFF; --shadow:0 1px 2px rgba(30,26,23,.06); --shadow-lg:0 10px 30px rgba(110,30,24,.12);
  --t1:#C62828; --t2:#2E7D32; --t3:#1565C0; --t4:#7B1FA2; --t5:#6B625B;
  --hz:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif; --hz-display:'Noto Serif SC','Noto Sans SC',serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151210; --card:#201B18; --ink:#F1EBE6; --muted:#B3A79E; --line:#3A322D; --soft:#2A2420;
    --hero:#6E1C17; --hero-ink:#FFFFFF; --hero-muted:#F0C6C0;
    --primary:#C2453B; --primary-ink:#FFFFFF; --accent:#F29A8F; --accent-soft:#3B1F1C;
    --good:#7FD69A; --good-soft:#163222; --bad:#F29BB8; --bad-soft:#3A1828; --warn:#F5BE66; --warn-soft:#3A2A10;
    --dark:#F1EBE6; --dark-ink:#151210; --shadow:none; --shadow-lg:0 10px 30px rgba(0,0,0,.35);
    --t1:#FF8A80; --t2:#81C784; --t3:#90CAF9; --t4:#CE93D8; --t5:#B3A79E; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#151210; --card:#201B18; --ink:#F1EBE6; --muted:#B3A79E; --line:#3A322D; --soft:#2A2420;
  --hero:#6E1C17; --hero-ink:#FFFFFF; --hero-muted:#F0C6C0;
  --primary:#C2453B; --primary-ink:#FFFFFF; --accent:#F29A8F; --accent-soft:#3B1F1C;
  --good:#7FD69A; --good-soft:#163222; --bad:#F29BB8; --bad-soft:#3A1828; --warn:#F5BE66; --warn-soft:#3A2A10;
  --dark:#F1EBE6; --dark-ink:#151210; --shadow:none; --shadow-lg:0 10px 30px rgba(0,0,0,.35);
  --t1:#FF8A80; --t2:#81C784; --t3:#90CAF9; --t4:#CE93D8; --t5:#B3A79E; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:'Noto Sans Thai',system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.shell{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.hz{font-family:var(--hz)}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.t1{color:var(--t1)} .t2{color:var(--t2)} .t3{color:var(--t3)} .t4{color:var(--t4)} .t5{color:var(--t5)}

.hero{background:var(--hero);color:var(--hero-ink);padding:22px 16px 18px;display:flex;flex-direction:column;gap:14px}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.hero h1{margin:0;font-size:26px;line-height:1.2;display:flex;align-items:baseline;gap:10px}
.hero h1 .seal{font-family:var(--hz-display);font-size:28px}
.hero p{margin:2px 0 0;font-size:13px;color:var(--hero-muted)}
.ring{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;flex:none}
.ring span{width:44px;height:44px;border-radius:50%;background:var(--hero);display:grid;place-items:center;font-size:12px;font-weight:700}
.search{display:flex;align-items:center;gap:10px;background:#FFFFFF;color:#6B625B;border-radius:12px;padding:0 14px;height:46px}
.search input{border:0;outline:0;flex:1;font-size:15px;background:transparent;color:#1E1A17;min-width:0}

.chips{display:flex;gap:8px;padding:14px 16px 4px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{height:36px;padding:0 13px;border-radius:18px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:600;white-space:nowrap;flex:none}
.chip[aria-pressed="true"]{background:var(--dark);color:var(--dark-ink);border-color:var(--dark)}
.meta{display:flex;justify-content:space-between;padding:8px 16px;font-size:12px;color:var(--muted)}

.lv{font-size:11px;font-weight:700;padding:1px 7px;border-radius:6px;white-space:nowrap;background:var(--soft);color:var(--muted)}
.lv-1,.lv-2{background:var(--good-soft);color:var(--good)}
.lv-3,.lv-4{background:var(--warn-soft);color:var(--warn)}
.lv-5,.lv-6{background:var(--bad-soft);color:var(--bad)}

.list{display:flex;flex-direction:column;gap:8px;padding:0 12px 12px}
.row{background:var(--card);border-radius:14px;padding:10px 8px 10px 14px;display:flex;align-items:center;gap:4px;box-shadow:var(--shadow)}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.row-word{font-family:var(--hz);font-size:22px;font-weight:500;line-height:1.2}
.row-py{font-size:14px;font-weight:600}
.row-pos{font-size:12px;color:var(--muted)}
.row-th{font-size:14px}
.known-dot{font-size:11px;color:var(--good);font-weight:600}
.icon-btn{width:44px;height:44px;border-radius:22px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;flex:none}
.icon-btn.speak{background:var(--accent-soft);color:var(--accent)}
.icon-btn[aria-pressed="true"]{color:#D99A00}
.more{margin:4px 12px 16px;width:calc(100% - 24px);height:48px;border-radius:14px;border:1px dashed var(--line);background:transparent;color:var(--muted);font-weight:600}
.empty{padding:40px 24px;text-align:center;color:var(--muted)}
.credit{padding:8px 20px 24px;font-size:12px;color:var(--muted);text-align:center;line-height:1.7}
.credit button{border:0;background:none;color:var(--accent);text-decoration:underline;font-size:12px;padding:4px}
.legend{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;font-size:12px;padding:0 16px 8px;color:var(--muted)}
.legend b{font-weight:700}

.topbar{padding:18px 16px 6px;display:flex;align-items:center;gap:12px}
.topbar h2{margin:0;flex:1;font-size:17px}
.pill{height:32px;padding:0 12px;border-radius:16px;font-size:13px;font-weight:700;display:flex;align-items:center;white-space:nowrap}
.bar{height:8px;border-radius:4px;background:var(--soft);overflow:hidden;margin:4px 16px 0}
.bar i{display:block;height:100%;background:var(--primary);border-radius:4px;transition:width .25s}
.segs{display:grid;gap:4px;padding:4px 16px 0}
.segs i{height:6px;border-radius:3px;background:var(--soft)}
.segs i.ok{background:var(--good)} .segs i.no{background:var(--bad)} .segs i.cur{background:var(--primary)}
.pad{padding:0 16px}
.card{background:var(--card);border-radius:24px;box-shadow:var(--shadow-lg);padding:28px 22px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.flash{width:100%;min-height:380px;border:0;margin-top:14px;justify-content:center}
.big-hz{font-family:var(--hz-display);font-size:64px;line-height:1.1;word-break:break-all}
.big-py{font-size:22px;font-weight:600}
.sub{font-size:14px;color:var(--muted)}
.back{width:100%;border-top:1px dashed var(--line);margin-top:10px;padding-top:16px;display:flex;flex-direction:column;gap:8px}
.back .th{font-size:24px;font-weight:700}
.ex{font-size:14px;color:var(--muted);line-height:1.7}
.ex .hz{font-size:17px;color:var(--ink)}
.hint{margin-top:16px;font-size:13px;color:var(--muted)}
.center{display:flex;justify-content:center;padding-top:14px}
.soft-btn{height:44px;padding:0 18px;border-radius:22px;border:0;background:var(--accent-soft);color:var(--accent);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:18px 16px}
.btn{height:56px;border-radius:16px;border:0;font-size:16px;font-weight:700;width:100%}
.btn-primary{background:var(--primary);color:var(--primary-ink)}
.btn-dark{background:var(--dark);color:var(--dark-ink)}
.btn-good{background:var(--good);color:var(--card)}
.btn-outline{background:var(--card);border:2px solid var(--bad);color:var(--bad)}
.btn-ghost{background:var(--card);border:1px solid var(--line);color:var(--muted);font-size:15px;font-weight:600}
.q-card{background:var(--hero);color:var(--hero-ink);border-radius:24px;padding:26px 22px;margin:16px 16px 0;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.q-card .k{font-size:13px;color:var(--hero-muted)}
.q-card .w{font-family:var(--hz-display);font-size:52px;line-height:1.15;word-break:break-all}
.q-card .s{font-size:15px;color:var(--hero-muted)}
.q-card .icon-btn{color:var(--hero-ink);background:rgba(255,255,255,.14)}
.opts{display:flex;flex-direction:column;gap:10px;padding:18px 16px 0}
.opt{min-height:56px;border-radius:16px;padding:10px 14px;border:2px solid var(--line);background:var(--card);font-size:16px;font-weight:600;display:flex;align-items:center;gap:12px;text-align:left}
.opt .dot{width:30px;height:30px;border-radius:15px;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--soft);color:var(--muted);flex:none}
.opt.right{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.opt.right .dot{background:var(--good);color:var(--card)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.opt.wrong .dot{background:var(--bad);color:var(--card)}
.fb{margin:14px 16px 0;padding:14px 16px;border-radius:14px;font-size:14px;line-height:1.7}
.fb.ok{background:var(--good-soft);color:var(--good)}
.fb.no{background:var(--bad-soft);color:var(--bad)}
.fb .plain{color:var(--ink)}
.pattern{margin-top:6px;font-size:22px;font-weight:700;letter-spacing:4px;word-break:break-all}
.field{display:flex;flex-direction:column;gap:8px;padding:18px 16px 0}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.ans{height:58px;border-radius:16px;padding:0 18px;font-size:22px;font-weight:700;outline:none;width:100%;border:2px solid var(--primary);background:var(--card);color:var(--ink)}
.ans.ok{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.ans.no{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tool{height:48px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
.tag{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:4px 12px;border-radius:16px;background:var(--accent-soft);color:var(--accent);font-size:13px}
.prompt{margin:12px 16px 0;padding:18px 20px;background:var(--card);border-radius:20px;display:flex;flex-direction:column;gap:4px}
.prompt .t{font-size:20px;font-weight:700;line-height:1.5}
.answer-box{margin:14px 16px 0;min-height:112px;padding:14px;border-radius:16px;display:flex;flex-wrap:wrap;align-content:flex-start;align-items:center;gap:8px;border:2px dashed var(--line);background:var(--soft)}
.answer-box.ok{border:2px solid var(--good);background:var(--good-soft)}
.answer-box.no{border:2px solid var(--bad);background:var(--bad-soft)}
.tile{min-height:48px;padding:0 14px;border-radius:12px;font-family:var(--hz);font-size:20px;font-weight:500;border:1px solid var(--line);background:var(--card);box-shadow:0 2px 0 var(--line)}
.tile.on{background:var(--primary);color:var(--primary-ink);border-color:var(--primary);box-shadow:none}
.tile.used{border:2px dashed var(--line);background:transparent;color:transparent;box-shadow:none;pointer-events:none}
.bank{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:18px 16px 0}
.done{padding:48px 24px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.done .score{font-family:var(--hz-display);font-size:56px;color:var(--accent);line-height:1}
.miss{margin:8px 16px 0;display:flex;flex-direction:column;gap:6px}
.miss div{background:var(--card);border-radius:12px;padding:10px 14px;font-size:14px;display:flex;justify-content:space-between;gap:12px}

.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:10}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));height:68px}
.nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--muted);text-decoration:none}
.nav a[aria-current="page"]{color:var(--accent);font-weight:700}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>

<script>
(function () {
  'use strict';
  var app = document.getElementById('app');
  var LEVELS = [1, 2, 3, 4, 5, 6];
  var ICON_SPEAK = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 010 7"/><path d="M18.5 5.5a9 9 0 010 13"/></svg>';
  var ICON_STAR = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>';
  var ICON_STAR_ON = ICON_STAR.replace('fill="none"', 'fill="currentColor"');
  var ICON_BACK = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>';

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
  }
  var store = {
    get: function (k, d) { try { var v = localStorage.getItem('hsk_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem('hsk_' + k, JSON.stringify(v)); } catch (e) {} }
  };
  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }

  /* ---------- pinyin helpers ---------- */
  var TONES = { 'ā':['a',1],'á':['a',2],'ǎ':['a',3],'à':['a',4],'ē':['e',1],'é':['e',2],'ě':['e',3],'è':['e',4],
    'ī':['i',1],'í':['i',2],'ǐ':['i',3],'ì':['i',4],'ō':['o',1],'ó':['o',2],'ǒ':['o',3],'ò':['o',4],
    'ū':['u',1],'ú':['u',2],'ǔ':['u',3],'ù':['u',4],'ǖ':['ü',1],'ǘ':['ü',2],'ǚ':['ü',3],'ǜ':['ü',4],'ń':['n',2],'ň':['n',3],'ǹ':['n',4] };
  function bare(s) { return s.split('').map(function (c) { return TONES[c] ? TONES[c][0] : c; }).join(''); }
  function toneOf(s) { for (var i = 0; i < s.length; i++) if (TONES[s[i]]) return TONES[s[i]][1]; return 5; }
  var FIN = 'iang|iong|uang|ueng|üan|ian|iao|ing|uai|uan|ang|eng|ong|üe|ün|ai|ei|ao|ou|an|en|er|ia|ie|iu|in|ua|uo|ui|un|ue|ng|a|o|e|i|u|ü|n|m';
  var SYL = new RegExp('^(zh|ch|sh|[bpmfdtnlgkhjqxrzcsyw])?(' + FIN.split('|').map(function (f) {
    return /n$|ng$/.test(f) ? f + '(?![aeiouü])' : f;
  }).join('|') + ')(r(?![aeiouü]))?', 'i');
  function syllables(py) {
    var b = bare(py.toLowerCase()), out = [], i = 0;
    while (i < py.length) {
      var m = SYL.exec(b.slice(i));
      if (m && m[0].length) { var seg = py.substr(i, m[0].length); out.push({ s: seg, t: toneOf(seg) }); i += m[0].length; }
      else { out.push({ s: py[i], t: 0 }); i++; }
    }
    return out;
  }
  function colorPy(py) {
    return syllables(py).map(function (x) { return x.t ? '<span class="t' + x.t + '">' + esc(x.s) + '</span>' : esc(x.s); }).join('');
  }
  function colorHz(w, py) {
    var syl = syllables(py.split('/')[0]).filter(function (x) { return x.t; });
    var chars = Array.from(w);
    var toneList = syl.map(function (x) { return x.t; });
    if (chars[chars.length - 1] === '儿' && toneList.length === chars.length - 1) toneList.push(5);
    if (toneList.length !== chars.length) return esc(w);
    return chars.map(function (c, i) { return '<span class="t' + toneList[i] + '">' + esc(c) + '</span>'; }).join('');
  }
  function normPy(s) { return bare(s.toLowerCase()).replace(/ü|v/g, 'u').replace(/[^a-z]/g, ''); }

  var W = (window.HSK || []).map(function (r) {
    return { w: r[0], p: r[1], pos: r[2], level: r[3], th: r[4], ans: r[1].split('/').map(normPy) };
  });
  var S = window.SENTENCES || [];
  var byWord = {}; W.forEach(function (x) { byWord[x.w] = x; });
  function exampleFor(w) { for (var i = 0; i < S.length; i++) if (S[i][2] === w) return S[i]; return null; }

  var known = new Set(store.get('known', []));
  var saved = new Set(store.get('saved', []));
  var level = store.get('level', 1);
  if (level !== 'all' && LEVELS.indexOf(level) < 0) level = 1;
  function saveSets() { store.set('known', Array.from(known)); store.set('saved', Array.from(saved)); }
  function pool() { return level === 'all' ? W : W.filter(function (x) { return x.level === level; }); }
  function countAt(l) { return W.filter(function (x) { return x.level === l; }).length; }

  var voice = null;
  function pickVoice() {
    if (!('speechSynthesis' in window)) return;
    var vs = window.speechSynthesis.getVoices();
    voice = vs.find(function (v) { return /zh[-_]CN/i.test(v.lang); }) || vs.find(function (v) { return /^zh/i.test(v.lang) && !/HK|TW/i.test(v.lang); }) || null;
  }
  if ('speechSynthesis' in window) { pickVoice(); window.speechSynthesis.onvoiceschanged = pickVoice; }
  function speak(text) {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN'; u.rate = 0.8; if (voice) u.voice = voice;
    window.speechSynthesis.speak(u);
  }

  function lvBadge(l) { return '<span class="lv lv-' + l + '">HSK ' + l + '</span>'; }
  function levelChips(extra) {
    var opts = LEVELS.map(function (l) { return [l, 'HSK ' + l]; }).concat([['all', 'ทั้งหมด']]);
    return '<div class="chips" role="group" aria-label="เลือกระดับ">' + opts.map(function (o) {
      return '<button class="chip" data-act="level" data-v="' + o[0] + '" aria-pressed="' + (level === o[0]) + '">' + o[1] + '</button>';
    }).join('') + (extra || '') + '</div>';
  }
  function topbar(title, right) {
    return '<div class="topbar"><a class="icon-btn" href="#list" aria-label="กลับหน้าคำศัพท์" style="background:var(--card);color:var(--ink)">' + ICON_BACK + '</a><h2>' + title + '</h2>' + (right || '') + '</div>';
  }

  var st = { listQ: '', listSaved: false, listLimit: 200 };
  var route = 'list';

  /* ---------- LIST ---------- */
  function viewList() {
    var p = pool();
    var k = p.filter(function (x) { return known.has(x.w); }).length;
    var pct = p.length ? Math.round(k / p.length * 100) : 0;
    app.innerHTML =
      '<header class="hero"><div class="hero-top"><div><h1><span class="seal">汉语</span>HSK 3.0</h1><p>ศัพท์ HSK ระดับ 1–6 · ' + W.length.toLocaleString() + ' คำ · พินอินและความหมายไทย</p></div>' +
      '<div class="ring" style="background:conic-gradient(#F5B841 0 ' + pct + '%, rgba(255,255,255,.2) ' + pct + '% 100%)" role="img" aria-label="จำได้แล้ว ' + pct + ' เปอร์เซ็นต์"><span>' + pct + '%</span></div></div>' +
      '<label class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>' +
      '<span class="sr">ค้นหาคำศัพท์</span><input id="q" type="search" placeholder="ค้นหา 汉字 / pinyin / ภาษาไทย" value="' + esc(st.listQ) + '" autocomplete="off"></label></header>' +
      levelChips('<button class="chip" data-act="savedOnly" aria-pressed="' + st.listSaved + '">★ ที่บันทึก</button>') +
      '<div class="meta"><span id="count"></span><span>จำได้แล้ว ' + k + '/' + p.length + '</span></div>' +
      '<div class="legend" aria-label="สีวรรณยุกต์"><span class="t1"><b>ā</b> เสียง 1</span><span class="t2"><b>á</b> เสียง 2</span><span class="t3"><b>ǎ</b> เสียง 3</span><span class="t4"><b>à</b> เสียง 4</span><span class="t5"><b>a</b> เสียงเบา</span></div>' +
      '<div class="list" id="list"></div><div id="more"></div>' +
      '<div class="credit">คำศัพท์และระดับตามหลักสูตรสอบ HSK 3.0 (新版HSK考试大纲, 2025)<br>ความหมายภาษาไทยเขียนเพิ่มสำหรับเว็บนี้ · ทำเพื่อแจกฟรี<br>' +
      (st.armReset ? '<button data-act="reset">กดอีกครั้งเพื่อยืนยันการล้าง</button> <button data-act="resetCancel">ยกเลิก</button>' : '<button data-act="armReset">ล้างความคืบหน้าทั้งหมด</button>') + '</div>';
    document.getElementById('q').addEventListener('input', function (e) { st.listQ = e.target.value; st.listLimit = 200; renderRows(); });
    renderRows();
  }
  function renderRows() {
    var q = st.listQ.trim(), qn = normPy(q);
    var src = q ? W : pool();
    var rows = src.filter(function (x) {
      if (st.listSaved && !saved.has(x.w)) return false;
      if (!q) return true;
      return x.w.indexOf(q) >= 0 || x.th.indexOf(q) >= 0 || (qn && x.ans.some(function (a) { return a.indexOf(qn) === 0; }));
    });
    document.getElementById('count').textContent = rows.length.toLocaleString() + ' คำ' + (q ? ' (ค้นหาทุกระดับ)' : '');
    var list = document.getElementById('list');
    if (!rows.length) {
      list.innerHTML = '<div class="empty">' + (st.listSaved ? 'ยังไม่มีคำที่บันทึกไว้ กด ☆ ที่คำศัพท์เพื่อบันทึก' : 'ไม่พบคำที่ค้นหา') + '</div>';
      document.getElementById('more').innerHTML = '';
      return;
    }
    list.innerHTML = rows.slice(0, st.listLimit).map(function (x) {
      var on = saved.has(x.w);
      return '<div class="row"><div class="row-main"><div class="row-head"><span class="row-word" lang="zh-CN">' + colorHz(x.w, x.p) + '</span>' +
        '<span class="row-py">' + colorPy(x.p) + '</span>' + lvBadge(x.level) +
        (known.has(x.w) ? '<span class="known-dot">✓ จำแล้ว</span>' : '') + '</div>' +
        '<span class="row-th">' + esc(x.th) + (x.pos ? ' <span class="row-pos">· ' + esc(x.pos) + '</span>' : '') + '</span></div>' +
        '<button class="icon-btn" data-act="star" data-k="' + esc(x.w) + '" aria-pressed="' + on + '" aria-label="บันทึกคำ ' + esc(x.w) + '">' + (on ? ICON_STAR_ON : ICON_STAR) + '</button>' +
        '<button class="icon-btn speak" data-act="speak" data-t="' + esc(x.w) + '" aria-label="ฟังเสียง ' + esc(x.w) + '">' + ICON_SPEAK + '</button></div>';
    }).join('');
    document.getElementById('more').innerHTML = rows.length > st.listLimit ? '<button class="more" data-act="more">แสดงเพิ่ม (เหลืออีก ' + (rows.length - st.listLimit) + ' คำ)</button>' : '';
  }

  /* ---------- FLASHCARDS ---------- */
  function newFlash() {
    var p = shuffle(pool());
    p.sort(function (a, b) { return (known.has(a.w) ? 1 : 0) - (known.has(b.w) ? 1 : 0); });
    st.flash = { deck: p.slice(0, 20), i: 0, back: false, got: 0 };
  }
  function viewFlash() {
    if (!st.flash) newFlash();
    var f = st.flash, n = f.deck.length;
    if (f.i >= n) {
      app.innerHTML = topbar('แฟลชการ์ด') + levelChips() +
        '<div class="done"><div class="score">' + f.got + '</div><div>คำที่จำได้ในรอบนี้</div><p class="sub">คำที่ยังไม่จำถูกวนกลับมาให้ทบทวนแล้ว</p>' +
        '<button class="btn btn-primary" data-act="flashNew" style="max-width:320px">เริ่มชุดใหม่</button></div>';
      return;
    }
    var c = f.deck[f.i], ex = exampleFor(c.w);
    app.innerHTML = topbar('แฟลชการ์ด', '<span class="pill" style="background:var(--soft);color:var(--muted)">' + (f.i + 1) + ' / ' + n + '</span>') +
      '<div class="bar"><i style="width:' + Math.round((f.i + 1) / n * 100) + '%"></i></div>' + levelChips() +
      '<div class="pad"><button class="card flash" data-act="flip" aria-label="พลิกการ์ด">' + lvBadge(c.level) +
      '<span class="big-hz" lang="zh-CN">' + (f.back ? colorHz(c.w, c.p) : esc(c.w)) + '</span>' +
      (f.back ? '<span class="big-py">' + colorPy(c.p) + '</span><div class="back"><span class="th">' + esc(c.th) + '</span>' +
        (c.pos ? '<span class="sub">' + esc(c.pos) + '</span>' : '') +
        (ex ? '<span class="ex"><span class="hz" lang="zh-CN">' + esc(ex[0].replace(/ /g, '')) + '。</span><br>' + esc(ex[1]) + '</span>' : '') + '</div>'
              : '<span class="hint">ลองนึกพินอินและความหมาย แล้วแตะการ์ดเพื่อดูเฉลย</span>') +
      '</button></div><div class="center"><button class="soft-btn" data-act="speak" data-t="' + esc(c.w) + '">' + ICON_SPEAK + 'ฟังเสียง</button></div>' +
      '<div class="actions"><button class="btn btn-outline" data-act="nope">ยังไม่จำ</button><button class="btn btn-good" data-act="yep">จำได้แล้ว ✓</button></div>' +
      '<p class="sub" style="text-align:center;margin:0 16px">คำที่ยังไม่จำจะวนกลับมาให้ทบทวนอีกครั้ง</p>';
  }

  /* ---------- QUIZ ---------- */
  function newQuiz() {
    var p = pool();
    var qs = shuffle(p).slice(0, 10).map(function (x) {
      var wrong = [];
      shuffle(p.length > 20 ? p : W).some(function (y) { if (y.th !== x.th && wrong.indexOf(y.th) < 0) wrong.push(y.th); return wrong.length === 3; });
      return { w: x, opts: shuffle([x.th].concat(wrong)) };
    });
    st.quiz = { qs: qs, i: 0, picked: null, res: [] };
  }
  function viewQuiz() {
    if (!st.quiz) newQuiz();
    var z = st.quiz, n = z.qs.length, score = z.res.filter(Boolean).length;
    if (z.i >= n) {
      var miss = z.qs.filter(function (q, i) { return !z.res[i]; });
      app.innerHTML = topbar('แบบทดสอบ') + levelChips() +
        '<div class="done"><div class="score">' + score + '/' + n + '</div><div>' + (score >= 8 ? '太棒了！เก่งมาก' : score >= 5 ? 'ดีแล้ว ฝึกต่ออีกนิด' : 'ไม่เป็นไร ลองทบทวนแล้วทำใหม่') + '</div></div>' +
        (miss.length ? '<div class="pad sub">คำที่ตอบผิด</div><div class="miss">' + miss.map(function (q) { return '<div><strong class="hz" lang="zh-CN">' + esc(q.w.w) + '</strong><span>' + esc(q.w.p) + ' · ' + esc(q.w.th) + '</span></div>'; }).join('') + '</div>' : '') +
        '<div class="pad" style="padding-top:18px"><button class="btn btn-primary" data-act="quizNew">ทำชุดใหม่</button></div>';
      return;
    }
    var q = z.qs[z.i], letters = ['A', 'B', 'C', 'D'];
    var segs = z.qs.map(function (x, i) { return '<i class="' + (i < z.res.length ? (z.res[i] ? 'ok' : 'no') : i === z.i ? 'cur' : '') + '"></i>'; }).join('');
    app.innerHTML = topbar('แบบทดสอบ · ข้อ ' + (z.i + 1) + '/' + n, '<span class="pill" style="background:var(--warn-soft);color:var(--warn)">คะแนน ' + score + '</span>') +
      '<div class="segs" style="grid-template-columns:repeat(' + n + ',minmax(0,1fr))">' + segs + '</div>' + levelChips() +
      '<section class="q-card"><span class="k">คำนี้แปลว่าอะไร?</span><span class="w" lang="zh-CN">' + esc(q.w.w) + '</span><span class="s">' +
      (z.picked !== null ? esc(q.w.p) + ' · ' : '') + 'HSK ' + q.w.level + '</span>' +
      '<button class="icon-btn" data-act="speak" data-t="' + esc(q.w.w) + '" aria-label="ฟังเสียง">' + ICON_SPEAK + '</button></section>' +
      '<div class="opts">' + q.opts.map(function (o, i) {
        var cls = '';
        if (z.picked !== null) { if (o === q.w.th) cls = ' right'; else if (i === z.picked) cls = ' wrong'; }
        return '<button class="opt' + cls + '" data-act="pick" data-i="' + i + '"' + (z.picked !== null ? ' disabled' : '') + '><span class="dot">' + letters[i] + '</span><span>' + esc(o) + '</span></button>';
      }).join('') + '</div>' +
      (z.picked !== null ? (function () {
        var ok = q.opts[z.picked] === q.w.th, ex = exampleFor(q.w.w);
        return '<div class="fb ' + (ok ? 'ok' : 'no') + '"><strong>' + (ok ? '对了！ถูกต้อง' : 'ยังไม่ใช่') + '</strong> <span class="hz" lang="zh-CN">' + esc(q.w.w) + '</span> ' + esc(q.w.p) + ' = ' + esc(q.w.th) +
          (ex ? '<br><span class="plain hz" lang="zh-CN">' + esc(ex[0].replace(/ /g, '')) + '。</span>' : '') + '</div>' +
          '<div class="pad" style="padding-top:16px;padding-bottom:16px"><button class="btn btn-dark" data-act="quizNext">' + (z.i + 1 < n ? 'ข้อต่อไป →' : 'ดูผลคะแนน') + '</button></div>';
      })() : '');
  }

  /* ---------- PINYIN SPELLING ---------- */
  function newSpell() {
    st.spell = { qs: shuffle(pool()).slice(0, 10), i: 0, value: '', hints: 1, checked: false, ok: false, score: 0, retried: {} };
  }
  function viewSpell() {
    if (!st.spell) newSpell();
    var s = st.spell, n = s.qs.length;
    if (s.i >= n) {
      app.innerHTML = topbar('เขียนพินอิน') + levelChips() +
        '<div class="done"><div class="score">' + s.score + '</div><div>คำที่เขียนพินอินถูก</div><button class="btn btn-primary" data-act="spellNew" style="max-width:320px">เริ่มชุดใหม่</button></div>';
      return;
    }
    var q = s.qs[s.i], target = q.ans[0];
    var pat = target.split('').map(function (c, i) { return i < s.hints ? c : '_'; }).join('');
    app.innerHTML = topbar('เขียนพินอิน · ข้อ ' + (s.i + 1) + '/' + n, '<span class="pill" style="background:var(--good-soft);color:var(--good)">ถูก ' + s.score + '</span>') + levelChips() +
      '<div class="pad"><section class="card" style="margin-top:4px"><span class="sub">พิมพ์พินอินของคำที่แปลว่า</span><span style="font-size:28px;font-weight:700;color:var(--accent);line-height:1.35">' + esc(q.th) + '</span>' +
      '<span class="sub">HSK ' + q.level + ' · ' + Array.from(q.w).length + ' ตัวอักษรจีน' + (q.pos ? ' · ' + esc(q.pos) : '') + '</span>' +
      (s.checked ? '<span class="big-hz" style="font-size:44px" lang="zh-CN">' + colorHz(q.w, q.p) + '</span>' : '') +
      '<div class="pattern mono" aria-label="คำใบ้">' + esc(pat) + '</div></section></div>' +
      '<div class="field"><label for="ans">พินอิน (ไม่ต้องใส่วรรณยุกต์ เช่น pengyou)</label><input id="ans" class="ans mono' + (s.checked ? (s.ok ? ' ok' : ' no') : '') + '" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="พิมพ์พินอินตรงนี้" value="' + esc(s.value) + '"' + (s.checked ? ' readonly' : '') + '>' +
      '<div class="two"><button class="tool" data-act="hint" style="color:var(--warn)"' + (s.checked ? ' disabled' : '') + '>ใบ้ 1 ตัวอักษร</button><button class="tool" data-act="speak" data-t="' + esc(q.w) + '" style="color:var(--accent)">' + ICON_SPEAK + 'ฟังเสียง</button></div></div>' +
      (s.checked ? '<div class="fb ' + (s.ok ? 'ok' : 'no') + '">' + (s.ok ? '<strong>ถูกต้อง!</strong> <span class="hz" lang="zh-CN">' + esc(q.w) + '</span> ' + colorPy(q.p) : '<strong>ยังไม่ถูก</strong> คำที่ถูกคือ <span class="hz" lang="zh-CN">' + esc(q.w) + '</span> <strong>' + colorPy(q.p) + '</strong><br><span class="plain">คำนี้จะกลับมาให้ฝึกอีกครั้งท้ายชุด</span>') + '</div>' : '') +
      '<div class="pad" style="padding-top:18px;padding-bottom:16px">' + (s.checked ? '<button class="btn btn-dark" data-act="spellNext">ข้อต่อไป →</button>' : '<button class="btn btn-primary" data-act="spellCheck">ตรวจคำตอบ</button>') + '</div>';
    var inp = document.getElementById('ans');
    inp.addEventListener('input', function (e) { s.value = e.target.value; });
    inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); act(s.checked ? 'spellNext' : 'spellCheck'); } });
    if (!s.checked) setTimeout(function () { try { inp.focus({ preventScroll: true }); } catch (e) {} }, 30);
  }

  /* ---------- SENTENCE ---------- */
  function newSentence() {
    var qs = shuffle(S).slice(0, 5).map(function (r) {
      var words = r[0].split(' '), idx = words.map(function (_, i) { return i; }), order = shuffle(idx), tries = 0;
      while (words.length > 1 && order.join() === idx.join() && tries++ < 10) order = shuffle(idx);
      return { zh: words.join(''), th: r[1], key: r[2], words: words, order: order };
    });
    st.sen = { qs: qs, i: 0, picked: [], checked: false, score: 0 };
  }
  function viewSentence() {
    if (!st.sen) newSentence();
    var z = st.sen, n = z.qs.length;
    if (z.i >= n) {
      app.innerHTML = topbar('เรียงประโยค') + '<div class="done"><div class="score">' + z.score + '/' + n + '</div><div>ประโยคที่เรียงถูก</div><button class="btn btn-primary" data-act="senNew" style="max-width:320px">ทำชุดใหม่</button></div>';
      return;
    }
    var q = z.qs[z.i], w = byWord[q.key];
    var ok = z.picked.map(function (k) { return q.words[k]; }).join('') === q.zh;
    app.innerHTML = topbar('เรียงประโยค · ข้อ ' + (z.i + 1) + '/' + n, '<span class="pill" style="background:var(--good-soft);color:var(--good)">ถูก ' + z.score + '</span>') +
      (w ? '<div class="pad" style="padding-top:8px"><span class="tag">คำศัพท์ข้อนี้: <strong class="hz" lang="zh-CN">' + esc(w.w) + '</strong> ' + esc(w.p) + ' = ' + esc(w.th) + '</span></div>' : '') +
      '<section class="prompt"><span class="sub">เรียงคำให้เป็นประโยคที่แปลว่า</span><span class="t">“' + esc(q.th) + '”</span></section>' +
      '<div class="answer-box' + (z.checked ? (ok ? ' ok' : ' no') : '') + '" aria-label="ประโยคของคุณ">' +
      (z.picked.length ? z.picked.map(function (k) { return '<button class="tile on" lang="zh-CN" data-act="unpick" data-k="' + k + '"' + (z.checked ? ' disabled' : '') + '>' + esc(q.words[k]) + '</button>'; }).join('') : '<span class="sub">แตะคำด้านล่างเพื่อเรียงประโยค</span>') +
      '</div><div class="bank">' + q.order.map(function (k) {
        var used = z.picked.indexOf(k) >= 0;
        return '<button class="tile' + (used ? ' used' : '') + '" lang="zh-CN" data-act="tile" data-k="' + k + '"' + (used || z.checked ? ' disabled' : '') + (used ? ' aria-hidden="true" tabindex="-1"' : '') + '>' + esc(q.words[k]) + '</button>';
      }).join('') + '</div>' +
      (z.checked ? '<div class="fb ' + (ok ? 'ok' : 'no') + '">' + (ok ? '<strong>对了！ถูกต้อง</strong> ' : '<strong>ยังไม่ถูก</strong> ประโยคที่ถูกคือ<br>') + '<span class="plain hz" lang="zh-CN" style="font-size:18px">' + esc(q.zh) + '。</span></div>' : '') +
      '<div class="pad" style="padding-top:18px;padding-bottom:16px;display:flex;gap:12px">' +
      (z.checked ? '<button class="btn btn-ghost" data-act="speak" data-t="' + esc(q.zh) + '" style="width:auto;padding:0 18px" aria-label="ฟังประโยค">' + ICON_SPEAK + '</button><button class="btn btn-dark" data-act="senNext">ข้อต่อไป →</button>'
                 : '<button class="btn btn-ghost" data-act="senClear" style="width:auto;padding:0 20px">ล้าง</button><button class="btn btn-primary" data-act="senCheck"' + (z.picked.length ? '' : ' disabled style="opacity:.5"') + '>ตรวจคำตอบ</button>') + '</div>';
  }

  /* ---------- actions ---------- */
  var views = { list: viewList, flash: viewFlash, quiz: viewQuiz, spell: viewSpell, sentence: viewSentence };
  function render() { views[route](); }

  function act(a, el) {
    var f = st.flash, z = st.quiz, s = st.spell, n = st.sen;
    switch (a) {
      case 'speak': speak(el.getAttribute('data-t')); return;
      case 'level': {
        var v = el.getAttribute('data-v');
        level = v === 'all' ? 'all' : +v; store.set('level', level);
        st.flash = st.quiz = st.spell = null; st.listLimit = 200; break;
      }
      case 'savedOnly': st.listSaved = !st.listSaved; break;
      case 'star': {
        var k = el.getAttribute('data-k');
        if (saved.has(k)) saved.delete(k); else saved.add(k);
        saveSets(); renderRows(); return;
      }
      case 'more': st.listLimit += 300; renderRows(); return;
      case 'armReset': st.armReset = true; break;
      case 'resetCancel': st.armReset = false; break;
      case 'reset': known.clear(); saved.clear(); saveSets(); st.armReset = false; break;
      case 'flip': f.back = !f.back; break;
      case 'yep': known.add(f.deck[f.i].w); saveSets(); f.got++; f.i++; f.back = false; break;
      case 'nope': {
        var c = f.deck[f.i]; known.delete(c.w); saveSets();
        if (f.deck.length < 40) f.deck.push(c);
        f.i++; f.back = false; break;
      }
      case 'flashNew': newFlash(); break;
      case 'pick':
        if (z.picked !== null) return;
        z.picked = +el.getAttribute('data-i');
        z.res.push(z.qs[z.i].opts[z.picked] === z.qs[z.i].w.th);
        break;
      case 'quizNext': z.i++; z.picked = null; break;
      case 'quizNew': newQuiz(); break;
      case 'hint': s.hints = Math.min(s.qs[s.i].ans[0].length, s.hints + 1); break;
      case 'spellCheck': {
        if (s.checked) return;
        var q = s.qs[s.i], typed = normPy(s.value);
        s.ok = !!typed && (q.ans.indexOf(typed) >= 0 || W.some(function (x) { return x.th === q.th && x.ans.indexOf(typed) >= 0; }));
        s.checked = true;
        if (s.ok) { s.score++; known.add(q.w); saveSets(); }
        else if (!s.retried[q.w]) { s.retried[q.w] = 1; s.qs.push(q); }
        break;
      }
      case 'spellNext': s.i++; s.value = ''; s.hints = 1; s.checked = false; s.ok = false; break;
      case 'spellNew': newSpell(); break;
      case 'tile': { var t = +el.getAttribute('data-k'); if (n.picked.indexOf(t) < 0) n.picked.push(t); break; }
      case 'unpick': { var u = +el.getAttribute('data-k'); n.picked = n.picked.filter(function (x) { return x !== u; }); break; }
      case 'senClear': n.picked = []; break;
      case 'senCheck': {
        var sq = n.qs[n.i];
        if (!n.picked.length) return;
        n.checked = true;
        if (n.picked.map(function (k2) { return sq.words[k2]; }).join('') === sq.zh) n.score++;
        break;
      }
      case 'senNext': n.i++; n.picked = []; n.checked = false; break;
      case 'senNew': newSentence(); break;
      default: return;
    }
    render();
  }
  app.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (el && app.contains(el) && !el.disabled) act(el.getAttribute('data-act'), el);
  });

  function onRoute() {
    var r = (location.hash || '#list').slice(1);
    route = views[r] ? r : 'list';
    document.querySelectorAll('.nav a').forEach(function (a) {
      if (a.getAttribute('data-r') === route) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    render();
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', onRoute);
  onRoute();
})();
</script>
</body>
